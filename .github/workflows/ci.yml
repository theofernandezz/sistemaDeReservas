name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # TODO: re-enable as a hard gate once the 239 pre-existing lint errors
      # are cleaned up (tracked separately, not part of this CI setup).
      - name: Lint
        run: pnpm lint
        continue-on-error: true

      - name: Type-check
        run: pnpm exec tsc --noEmit

      - name: Test
        run: pnpm test -- --run

      - name: Build
        run: pnpm build

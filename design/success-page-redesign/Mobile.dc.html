<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; }
    a { color: inherit; text-decoration: none; }
  </style>
</helmet>

<div style="width: 100%; min-height: 844px; background: oklch(1 0 0); color: oklch(0.145 0 0); display: flex; align-items: flex-start; justify-content: center; padding: 40px 18px;">

  <div style="width: 100%; border: 1px solid oklch(0.922 0 0); border-radius: 18px; padding: 26px 20px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 20px;">

    <div style="width: 56px; height: 56px; border-radius: 999px; border: 1.5px solid #16a34a; display: flex; align-items: center; justify-content: center;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>

    <div style="display: flex; flex-direction: column; gap: 5px;">
      <h1 style="margin: 0; font-size: 21px; font-weight: 700; letter-spacing: -0.01em;">Reserva confirmada</h1>
      <p style="margin: 0; font-size: 13px; color: oklch(0.556 0 0);">Tu cita fue agendada con éxito.</p>
    </div>

    <div style="width: 100%; border: 1px solid oklch(0.922 0 0); border-radius: 14px; padding: 16px; text-align: left; display: flex; flex-direction: column; gap: 9px;">
      <h3 style="margin: 0 0 3px; font-size: 14px; font-weight: 700;">Corte + Barba</h3>
      <div style="height: 1px; background: oklch(0.922 0 0);"></div>
      <div style="display: flex; justify-content: space-between; font-size: 12.5px;">
        <span style="color: oklch(0.556 0 0);">Fecha</span>
        <span style="font-weight: 500;">Lunes 31 de agosto</span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12.5px;">
        <span style="color: oklch(0.556 0 0);">Hora</span>
        <span style="font-weight: 500;">09:00</span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 12.5px;">
        <span style="color: oklch(0.556 0 0);">Cliente</span>
        <span style="font-weight: 500;">Lucas Herrera</span>
      </div>
      <div style="height: 1px; background: oklch(0.922 0 0); margin: 3px 0;"></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span style="font-size: 12.5px; font-weight: 600;">Total</span>
        <span style="font-size: 16px; font-weight: 700;">$20.000</span>
      </div>
    </div>

    <div style="width: 100%; display: flex; flex-direction: column; gap: 9px;">
      <span style="font-size: 10.5px; color: oklch(0.708 0 0);">Agregar a tu calendario</span>
      <div style="display: flex; gap: 9px;">
        <button style="flex: 1; height: 40px; border-radius: 10px; border: 1px solid oklch(0.9 0 0); background: none; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; font-weight: 500;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
          Google
        </button>
        <button style="flex: 1; height: 40px; border-radius: 10px; border: 1px solid oklch(0.9 0 0); background: none; display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12.5px; font-weight: 500;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
          Apple
        </button>
      </div>
    </div>

    <div style="width: 100%; display: flex; gap: 9px; align-items: flex-start; text-align: left;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color: oklch(0.556 0 0); flex-shrink: 0; margin-top: 2px;"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      <p style="margin: 0; font-size: 12px; color: oklch(0.556 0 0); line-height: 1.5;">
        Te enviamos un email con un link para reprogramar o cancelar tu turno si lo necesitás.
      </p>
    </div>

    <button type="button" style="display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: oklch(0.556 0 0); background: none; border: none;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="10" height="10" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      Copiar link para gestionar tu reserva
    </button>

    <a href="#" style="width: 100%; height: 46px; border-radius: 11px; background: oklch(0.145 0 0); color: oklch(1 0 0); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center;">
      Volver al inicio
    </a>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#f97316","options":["#f97316","#c2703d","#0f766e","#7c3aed"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#f97316' };
  }
}
</script>
</body>
</html>

<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&display=swap');
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Geist', ui-sans-serif, system-ui, sans-serif; }
    a { color: inherit; text-decoration: none; }

    .btn-outline { transition: border-color .15s ease; }
    .btn-outline:hover { border-color: oklch(0.7 0 0); }

    .cta-primary { transition: opacity .18s ease; }
    .cta-primary:hover { opacity: 0.9; }

    .ghost-link { transition: color .15s ease; }
    .ghost-link:hover { color: oklch(0.145 0 0); }
  </style>
</helmet>

<div style="width: 100%; min-height: 900px; background: oklch(1 0 0); color: oklch(0.145 0 0); display: flex; align-items: center; justify-content: center; padding: 40px;">

  <div style="width: 100%; max-width: 560px; border: 1px solid oklch(0.922 0 0); border-radius: 20px; padding: 40px; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 24px;">

    <!-- Icon -->
    <div style="width: 64px; height: 64px; border-radius: 999px; border: 1.5px solid #16a34a; display: flex; align-items: center; justify-content: center;">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
    </div>

    <!-- Heading -->
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.01em;">Reserva confirmada</h1>
      <p style="margin: 0; font-size: 14px; color: oklch(0.556 0 0);">Tu cita fue agendada con éxito.</p>
    </div>

    <!-- Details -->
    <div style="width: 100%; border: 1px solid oklch(0.922 0 0); border-radius: 14px; padding: 20px; text-align: left; display: flex; flex-direction: column; gap: 10px;">
      <h3 style="margin: 0 0 4px; font-size: 15px; font-weight: 700;">Corte + Barba</h3>
      <div style="height: 1px; background: oklch(0.922 0 0);"></div>
      <div style="display: flex; justify-content: space-between; font-size: 13px;">
        <span style="color: oklch(0.556 0 0);">Fecha</span>
        <span style="font-weight: 500;">Lunes 31 de agosto</span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px;">
        <span style="color: oklch(0.556 0 0);">Hora</span>
        <span style="font-weight: 500;">09:00</span>
      </div>
      <div style="display: flex; justify-content: space-between; font-size: 13px;">
        <span style="color: oklch(0.556 0 0);">Cliente</span>
        <span style="font-weight: 500;">Lucas Herrera</span>
      </div>
      <div style="height: 1px; background: oklch(0.922 0 0); margin: 4px 0;"></div>
      <div style="display: flex; justify-content: space-between; align-items: baseline;">
        <span style="font-size: 13px; font-weight: 600;">Total</span>
        <span style="font-size: 17px; font-weight: 700;">$20.000</span>
      </div>
    </div>

    <!-- Add to calendar -->
    <div style="width: 100%; display: flex; flex-direction: column; gap: 10px;">
      <span style="font-size: 11px; color: oklch(0.708 0 0);">Agregar a tu calendario</span>
      <div style="display: flex; gap: 10px;">
        <button class="btn-outline" style="flex: 1; height: 42px; border-radius: 10px; border: 1px solid oklch(0.9 0 0); background: none; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 13px; font-weight: 500; cursor: pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
          Google
        </button>
        <button class="btn-outline" style="flex: 1; height: 42px; border-radius: 10px; border: 1px solid oklch(0.9 0 0); background: none; display: flex; align-items: center; justify-content: center; gap: 7px; font-size: 13px; font-weight: 500; cursor: pointer;">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
          Apple / Outlook
        </button>
      </div>
    </div>

    <!-- Email note -->
    <div style="width: 100%; display: flex; gap: 10px; align-items: flex-start; text-align: left;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" style="color: oklch(0.556 0 0); flex-shrink: 0; margin-top: 2px;"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      <p style="margin: 0; font-size: 12.5px; color: oklch(0.556 0 0); line-height: 1.5;">
        Te enviamos un email con un link para reprogramar o cancelar tu turno si lo necesitás.
      </p>
    </div>

    <button type="button" class="ghost-link" style="display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: oklch(0.556 0 0); background: none; border: none; cursor: pointer;">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="10" height="10" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
      Copiar link para gestionar tu reserva
    </button>

    <a href="#" class="cta-primary" style="width: 100%; height: 48px; border-radius: 11px; background: oklch(0.145 0 0); color: oklch(1 0 0); font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center;">
      Volver al inicio
    </a>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"accent":{"editor":"color","default":"#f97316","options":["#f97316","#c2703d","#0f766e","#7c3aed"]}}'>
class Component extends DCLogic {
  renderVals() {
    return { accent: this.props.accent ?? '#f97316' };
  }
}
</script>
</body>
</html>
